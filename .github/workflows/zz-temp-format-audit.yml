name: Temporary StyLua Audit Formatter

on:
  push:
    branches:
      - audit/static-security-performance-2026-09-17

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: audit/static-security-performance-2026-09-17

      - name: Install Rokit
        shell: bash
        run: |
          ROKIT_INSTALLER_URL="https://raw.githubusercontent.com/rojo-rbx/rokit/2f2618428ef31279e2fc80b0b1d73485bc929ddd/scripts/install.sh"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "$ROKIT_INSTALLER_URL" | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        shell: bash
        run: "$HOME/.rokit/bin/rokit install --no-trust-check"

      - name: Format
        run: stylua src spec.lua

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src spec.lua
          git commit -m "Apply StyLua formatting"
          git push origin HEAD:audit/static-security-performance-2026-09-17
