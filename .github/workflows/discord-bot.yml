name: Discord Bot CI

on:
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/discord-bot.yml"
  push:
    branches:
      - main
    paths:
      - "bot/**"
      - ".github/workflows/discord-bot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Check bot syntax
        working-directory: bot
        run: npm run check

      - name: Run bot tests
        working-directory: bot
        run: npm test
