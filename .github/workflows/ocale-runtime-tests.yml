name: OCALE Runtime Tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ocale-runtime-10766713640
  cancel-in-progress: false

jobs:
  runtime-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: "10766713640"
      ROBLOX_PLACE_ID: "75490500628229"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Roblox test configuration
        id: config
        shell: bash
        run: |
          if [[ -z "${ROBLOX_API_KEY:-}" ]]; then
            echo "::notice::ROBLOX_API_KEY is not configured yet; OCALE execution is skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Rokit
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          ROKIT_INSTALLER_URL="https://raw.githubusercontent.com/rojo-rbx/rokit/2f2618428ef31279e2fc80b0b1d73485bc929ddd/scripts/install.sh"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "$ROKIT_INSTALLER_URL" | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: "$HOME/.rokit/bin/rokit install --no-trust-check"

      - name: Install Wally packages
        if: steps.config.outputs.ready == 'true'
        run: wally install

      - name: Verify OCALE CLI
        if: steps.config.outputs.ready == 'true'
        run: rocale-cli --help >/dev/null

      - name: Execute Jest in Roblox Open Cloud
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: ./scripts/run-ocale-tests.sh
