name: OCALE Runtime Tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ocale-runtime-10766713640
  cancel-in-progress: false

jobs:
  runtime-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: "10766713640"
      ROBLOX_PLACE_ID: "75490500628229"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Roblox test configuration
        id: config
        shell: bash
        run: |
          if [[ -z "${ROBLOX_API_KEY:-}" ]]; then
            echo "::notice::ROBLOX_API_KEY is not configured yet; OCALE execution is skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Rokit
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          ROKIT_INSTALLER_URL="https://raw.githubusercontent.com/rojo-rbx/rokit/2f2618428ef31279e2fc80b0b1d73485bc929ddd/scripts/install.sh"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "$ROKIT_INSTALLER_URL" | bash -s -- 1.2.0
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned project toolchain
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: "$HOME/.rokit/bin/rokit install --no-trust-check"

      - name: Prepare pinned OCALE build manifest
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          cat > foreman.toml <<'EOF'
          [tools]
          lute = { source = "luau-lang/lute", version = "=0.1.0-nightly.20260303" }
          rojo = { source = "rojo-rbx/rojo", version = "7.3.0" }
          EOF

      - name: Install pinned OCALE build tools
        if: steps.config.outputs.ready == 'true'
        uses: Roblox/setup-foreman@v3
        with:
          version: "^1.0.0"
          token: ${{ github.token }}
          allow-external-github-orgs: true

      - name: Build pinned OCALE CLI from source
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROCALE_TAG="v0.1.3"
          ROCALE_COMMIT="d154b3cc9a834adf7408d5cf78f079a4ea33efe6"
          SOURCE_DIR="$RUNNER_TEMP/rocale-cli-src"

          rm -rf "$SOURCE_DIR"
          git clone --quiet --depth 1 --branch "$ROCALE_TAG" https://github.com/Roblox/rocale-cli.git "$SOURCE_DIR"

          pushd "$SOURCE_DIR" >/dev/null
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_COMMIT" != "$ROCALE_COMMIT" ]]; then
            echo "::error::Unexpected rocale-cli source commit: $ACTUAL_COMMIT"
            exit 1
          fi

          # v0.1.3 crashes when Roblox returns a completed task with no log records.
          # Treat an absent/empty log collection as no output so task-state handling still runs.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/core/ocaleSdk.luau")
          text = path.read_text()
          old = '''\tlocal body = json.deserialize(response.body) :: any
\tlocal logs = body.luauExecutionSessionTaskLogs[1].messages
\tlog.fatalif(not logs, "Error downloading task logs")

\treturn logs
'''
          new = '''\tlocal body = json.deserialize(response.body) :: any
\tlocal taskLogs = body.luauExecutionSessionTaskLogs
\tif not taskLogs or #taskLogs == 0 then
\t\treturn {}
\tend

\tlocal logs = taskLogs[1].messages
\treturn logs or {}
'''
          if text.count(old) != 1:
              raise SystemExit("Unexpected v0.1.3 getTaskLogs source shape")
          path.write_text(text.replace(old, new, 1))
          PY

          lute setup
          lute scripts/build "$ROCALE_TAG" "$ROCALE_COMMIT"
          popd >/dev/null

          echo "ROCALE_WORKDIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "ROCALE_CLI=./build/rocale-cli" >> "$GITHUB_ENV"

      - name: Install Wally packages
        if: steps.config.outputs.ready == 'true'
        run: wally install

      - name: Verify OCALE CLI
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          rojo --version
          pushd "$ROCALE_WORKDIR" >/dev/null
          "$ROCALE_CLI" help | grep -q "Build, upload, and run a Roblox project in Open Cloud"
          "$ROCALE_CLI" run --help | grep -q -- "--universeId"
          popd >/dev/null

      - name: Probe Roblox Luau Execution without publishing
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pushd "$ROCALE_WORKDIR" >/dev/null
          probe_output="$("$ROCALE_CLI" run \
            --universeId "$ROBLOX_UNIVERSE_ID" \
            --placeId "$ROBLOX_PLACE_ID" \
            --load.version 0 \
            --script "$GITHUB_WORKSPACE/scripts/ocale-probe.luau" \
            --timeout 60 \
            --verbose 2>&1)"
          popd >/dev/null
          printf '%s\n' "$probe_output"
          grep -q "OCALE_PROBE_OK" <<<"$probe_output"

      - name: Execute Jest in Roblox Open Cloud
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: bash scripts/run-ocale-tests.sh
