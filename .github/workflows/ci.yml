name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rokit
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        shell: bash
        run: "$HOME/.rokit/bin/rokit install --no-trust-check"

      - name: Install Wally packages
        run: wally install

      - name: Emit initial Wally lockfile
        run: cat wally.lock

      - name: Check formatting
        run: stylua --check src spec.lua

      - name: Lint Luau
        run: selene src spec.lua

      - name: Build shipping project
        run: |
          mkdir -p build
          rojo build default.project.json --output build/ScrapToBotFactory.rbxlx

      - name: Build test project
        run: rojo build test.project.json --output build/ScrapToBotTests.rbxm
