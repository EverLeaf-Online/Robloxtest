[package]
name = "everleaf-online/scrap-to-bot-factory"
description = "Profit-first Roblox simulator prototype"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[place]
shared-packages = "game.ReplicatedStorage.Packages"
server-packages = "game.ServerScriptService.ServerPackages"

[dependencies]
React = "roblox/react@=17.3.11"
ReactRoblox = "roblox/react-roblox@=17.3.11"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"

[dev-dependencies]
Jest = "roblox/jest@=3.20.1"
JestGlobals = "roblox/jest-globals@=3.20.1"
